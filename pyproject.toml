[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-pipeline"
version = "0.1.0"
description = "Medical imaging pipeline for MRI preprocessing, tumor segmentation, 3D reconstruction, validation, and white-matter tract risk analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MRI Pipeline Contributors" }]
keywords = ["mri", "dicom", "nifti", "monai", "segmentation", "tractography"]
dependencies = [
    "pydicom",
    "SimpleITK",
    "monai",
    "nibabel",
    "scikit-image",
    "trimesh",
    "plotly",
    "numpy",
    "scipy",
    "pandas",
    "pydantic>=2.0",
    "PyYAML",
    "h5py",
    "tensorboard",
    "matplotlib",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ipykernel",
    "jupyter",
]
dicom = [
    "dicom2nifti",
]
tracts = [
    "dipy",
    "TractSeg",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
